<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dark:#0a0506; --bg-card:#160d0e; --bg-elevated:#211314; --bg-hover:#2e1a1b;
  --primary:#e11d2e; --primary-dark:#991b1b; --primary-light:#f87171; --primary-glow:#1c0a0c;
  --secondary:#b91c1c; --success:#22c55e; --success-dark:#16a34a; --warning:#f59e0b;
  --danger:#ef4444; --danger-dark:#b91c1c; --info:#fb7185; --accent:#fb7185; --gold:#fbbf24;
  --text:#f8fafc; --text-secondary:#cbb6b8; --text-muted:#8b7173; --border:#2c1819;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-dark)}
::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--bg-hover)}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}

/* ---------- shared keyframes ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinrev{to{transform:rotate(-360deg)}}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.08)}66%{transform:translate(-25px,25px) scale(.95)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 40px rgba(225,29,46,.45),0 0 0 0 rgba(225,29,46,.4)}50%{box-shadow:0 0 90px rgba(225,29,46,.85),0 0 0 22px rgba(225,29,46,0)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes particleUp{from{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}to{transform:translateY(-110vh);opacity:0}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes zoomFade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.fade-out{animation:fadeOut .6s ease forwards}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:22px;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,#2a0d10 0%,var(--bg-dark) 55%),radial-gradient(circle at 75% 80%,#240a18 0%,transparent 60%);background-color:var(--bg-dark)}
.splash-circle{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(225,29,46,.22),transparent 70%);filter:blur(6px);animation:floaty 12s ease-in-out infinite}
.splash-circle:nth-child(2){animation-duration:16s;animation-direction:reverse}
.splash-badge-wrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.splash-ring{position:absolute;width:170px;height:170px;border-radius:50%;border:3px dashed rgba(225,29,46,.55);animation:spin 9s linear infinite}
.splash-ring.r2{width:210px;height:210px;border-style:dotted;border-color:rgba(248,113,113,.35);animation:spinrev 14s linear infinite}
.splash-badge{width:110px;height:110px;border-radius:30px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:54px;animation:pulseGlow 2.4s ease-in-out infinite}
.splash-badge span{display:inline-block;animation:bob 2s ease-in-out infinite}
.splash-title{font-size:36px;font-weight:800;letter-spacing:2px;z-index:2;animation:riseIn .7s ease both .1s;
  background:linear-gradient(90deg,#fff,var(--primary-light),#fff,var(--primary),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:riseIn .7s ease both .1s,shimmer 3s linear infinite}
.splash-sub{font-size:13px;font-weight:700;color:var(--primary-light);letter-spacing:5px;z-index:2;animation:riseIn .7s ease both .25s}
.spinner{width:50px;height:50px;border:5px solid rgba(225,29,46,.18);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;z-index:2}
.splash-bar{width:320px;max-width:80vw;height:9px;background:var(--bg-elevated);border-radius:5px;overflow:hidden;z-index:2;box-shadow:inset 0 0 0 1px var(--border)}
.splash-bar > div{height:100%;width:0;background:linear-gradient(90deg,var(--primary-dark),var(--primary),var(--primary-light));border-radius:5px;transition:width .35s cubic-bezier(.4,0,.2,1);box-shadow:0 0 16px rgba(225,29,46,.7)}
.splash-status{font-size:12px;color:var(--text-muted);z-index:2;animation:riseIn .5s ease both}
.particles{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.particles i{position:absolute;bottom:-20px;font-size:18px;opacity:0;animation:particleUp linear infinite}

/* ---------- LOGIN ---------- */
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes aurora{0%{transform:rotate(0) scale(1.4)}100%{transform:rotate(360deg) scale(1.4)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#login{position:fixed;inset:0;background:var(--bg-dark);display:flex;align-items:center;justify-content:center;z-index:900;overflow:hidden;animation:zoomFade .6s ease both}
#login::before{content:"";position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax;z-index:0;opacity:.5;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(225,29,46,.25) 60deg,transparent 140deg,rgba(248,113,113,.18) 220deg,transparent 320deg);animation:aurora 22s linear infinite}
.login-circle{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(225,29,46,.18),transparent 70%);filter:blur(4px);animation:floaty 14s ease-in-out infinite}
.login-circle:nth-child(2){animation-duration:18s;animation-direction:reverse}
.login-circle:nth-child(3){animation-duration:11s}
.login-card{position:relative;z-index:2;background:linear-gradient(160deg,var(--bg-card),#120a0b);border:1px solid var(--border);border-radius:24px;width:430px;max-width:92vw;padding:50px 50px 40px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(225,29,46,.08);animation:popIn .55s cubic-bezier(.2,.8,.2,1) both}
.login-card.shake{animation:shake .4s ease}
.login-logo-wrap{position:relative;width:96px;height:96px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.login-logo-ring{position:absolute;inset:-12px;border-radius:50%;border:2px dashed rgba(225,29,46,.5);animation:spin 8s linear infinite}
.login-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:38px;animation:pulseGlow 2.6s ease-in-out infinite}
.login-logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.login-title{font-size:32px;font-weight:800;animation:dropIn .6s ease both .1s;
  background:linear-gradient(90deg,#fff,var(--primary-light),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:dropIn .6s ease both .1s,shimmer 4s linear infinite}
.login-sub{font-size:13px;color:var(--text-muted);margin:6px 0 35px;animation:riseIn .6s ease both .2s}
.input-row{display:flex;align-items:center;gap:10px;margin:14px 0;animation:riseIn .55s ease both}
.input-row:nth-of-type(1){animation-delay:.28s}.input-row:nth-of-type(2){animation-delay:.38s}
.input-icon{width:45px;height:45px;border-radius:10px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:.25s}
.input-row:focus-within .input-icon{background:var(--primary);transform:scale(1.08)}
.input-row input{flex:1;height:45px;border-radius:10px;background:var(--bg-dark);border:1px solid var(--border);color:var(--text);padding:0 15px;font-size:14px;transition:.25s}
.input-row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(225,29,46,.18)}
.login-btn{position:relative;overflow:hidden;width:100%;height:50px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:700;margin-top:22px;transition:.2s;animation:riseIn .55s ease both .48s;box-shadow:0 8px 24px rgba(225,29,46,.35)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(225,29,46,.55)}
.login-btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{left:-120%}55%,100%{left:160%}}
.login-error{color:var(--danger);font-size:13px;min-height:20px;margin-top:12px;font-weight:600}
.demo-box{background:var(--bg-elevated);border-radius:10px;padding:12px;margin-top:18px;font-size:12px;color:var(--text-secondary);animation:riseIn .55s ease both .56s}
.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-top:10px;animation:riseIn .55s ease both .44s}
.remember input{width:16px;height:16px;accent-color:var(--primary)}
#app{animation:zoomFade .55s ease both}

/* ---------- APP LAYOUT ---------- */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;background:var(--bg-card);height:100vh;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);transition:width .2s}
.brand{display:flex;align-items:center;gap:12px;padding:25px 20px}
.brand-logo{width:46px;height:46px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.brand-text h1{font-size:18px;font-weight:800;white-space:nowrap}
.brand-text span{font-size:10px;color:var(--text-muted);letter-spacing:1px;white-space:nowrap}
.nav-scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.nav-section{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:1px;padding:16px 20px 6px}
.nav-item{display:flex;align-items:center;gap:12px;margin:2px 10px;padding:0 14px;height:42px;border-radius:10px;color:var(--text-secondary);font-size:14px;background:transparent;width:calc(100% - 20px);text-align:left;transition:.15s}
.nav-item:hover{background:var(--bg-elevated)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item .ic{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.user-box{margin:12px;padding:14px;background:var(--bg-elevated);border-radius:12px}
.user-row{display:flex;align-items:center;gap:10px}
.user-avatar{width:40px;height:40px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.user-name{font-size:14px;font-weight:600}
.user-role{font-size:11px;color:var(--text-muted);text-transform:capitalize}
.logout-btn{width:100%;margin-top:10px;height:38px;border-radius:9px;background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-size:13px;transition:.15s}
.logout-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 30px;border-bottom:1px solid var(--border);gap:14px;flex-shrink:0;flex-wrap:wrap}
.topbar .menu-btn{display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);width:42px;height:42px;border-radius:10px;font-size:18px;color:var(--text);flex-shrink:0;transition:.15s}
.topbar .menu-btn:hover{background:var(--primary)}

/* collapsed icon-rail (desktop) */
.sidebar.collapsed{width:78px}
.sidebar.collapsed .brand{justify-content:center;padding:22px 0}
.sidebar.collapsed .brand-text{display:none}
.sidebar.collapsed .nav-section{text-align:center;padding:14px 0 6px;font-size:0}
.sidebar.collapsed .nav-section::after{content:"•••";font-size:10px;color:var(--border)}
.sidebar.collapsed .nav-item{justify-content:center;padding:0;width:calc(100% - 20px)}
.sidebar.collapsed .nav-item span:not(.ic){display:none}
.sidebar.collapsed .nav-badge{position:absolute;margin:0;transform:translate(14px,-12px);padding:0 5px}
.sidebar.collapsed .nav-item{position:relative}
.sidebar.collapsed .user-box{padding:10px;display:flex;flex-direction:column;align-items:center}
.sidebar.collapsed .user-row > div:not(.user-avatar){display:none}
.sidebar.collapsed .logout-btn{font-size:0;height:34px;margin-top:8px}
.sidebar.collapsed .logout-btn::before{content:"⎋";font-size:16px}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:650;opacity:0;visibility:hidden;transition:.2s}
.sidebar-backdrop.show{opacity:1;visibility:visible}
.page-title{font-size:24px;font-weight:800}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.topbar-search{flex:1;min-width:160px;max-width:340px;display:none;align-items:center;gap:8px;background:var(--bg-elevated);border-radius:12px;padding:0 14px;height:44px}
.topbar-search.active{display:flex}
.topbar-search input{background:transparent;border:none;color:var(--text);flex:1;min-width:0;font-size:14px;outline:none}
.content{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:24px 30px 60px}

/* ---------- COMPONENTS ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:.25s}
.stat-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.stat-icon{font-size:34px;margin-bottom:10px}
.stat-value{font-size:30px;font-weight:800}
.stat-label{color:var(--text-muted);font-size:13px;margin-top:2px}
.stat-trend{font-size:12px;margin-top:8px}
.stat-trend.up{color:var(--success)} .stat-trend.down{color:var(--danger)}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.card-head h2{font-size:17px;font-weight:700}
.card-body{padding:18px 22px}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 22px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg-elevated)}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block;white-space:nowrap}
.badge-success{background:rgba(34,197,94,.18);color:var(--success)}
.badge-danger{background:rgba(239,68,68,.18);color:var(--danger)}
.badge-warning{background:rgba(245,158,11,.18);color:var(--warning)}
.badge-muted{background:var(--bg-elevated);color:var(--text-muted)}
.badge-info{background:rgba(251,113,133,.18);color:var(--info)}
.btn{padding:10px 18px;border-radius:9px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:var(--bg-elevated);color:var(--text)}
.btn-ghost:hover{background:var(--bg-hover)}
.btn-success{background:var(--success);color:#fff} .btn-success:hover{background:var(--success-dark)}
.btn-danger{background:var(--danger);color:#fff} .btn-danger:hover{background:var(--danger-dark)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.icon-btn{background:var(--bg-elevated);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);transition:.15s}
.icon-btn:hover{background:var(--primary)}
.search-inline{display:flex;align-items:center;gap:8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:9px;padding:0 12px;height:40px}
.search-inline input{background:transparent;border:none;color:var(--text);outline:none;font-size:13px;width:200px}
.row-actions{display:flex;gap:6px}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .big{font-size:46px;margin-bottom:10px}

.member-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-elevated);border-radius:10px;margin:6px 0}
.avatar{width:38px;height:38px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.quick-btn{display:flex;align-items:center;gap:8px;width:100%;height:46px;border-radius:10px;font-weight:600;font-size:14px;padding:0 16px;color:#fff;margin-bottom:8px;text-align:left}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.product-card{background:var(--bg-elevated);border:1px solid transparent;border-radius:14px;padding:20px;text-align:center;transition:.2s;position:relative}
.product-card:hover{border-color:var(--primary);transform:translateY(-3px)}
.product-icon{font-size:40px;margin-bottom:10px}
.product-name{font-weight:700;margin-bottom:3px}
.product-cat{font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:capitalize}
.product-price{font-size:20px;font-weight:800;color:var(--primary-light)}
.product-stock{font-size:12px;color:var(--text-secondary);margin-top:6px}
.product-actions{display:flex;gap:6px;justify-content:center;margin-top:12px}

.list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--bg-elevated)}
.li-left{display:flex;align-items:center;gap:14px}
.li-icon{width:44px;height:44px;border-radius:10px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.li-title{font-weight:600}
.li-sub{font-size:12px;color:var(--text-muted)}

/* progress bars (finance/reports) */
.bar-track{height:10px;background:var(--bg-elevated);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;background:var(--bg-dark);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.field textarea{resize:vertical;min-height:90px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* intl phone field */
.phone-field{position:relative;display:flex;gap:8px}
.phone-cc{display:flex;align-items:center;gap:6px;background:var(--bg-dark);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.phone-cc:hover{border-color:var(--primary)}
.phone-cc-flag{font-size:18px;line-height:1}
.phone-cc-caret{color:var(--text-secondary);font-size:11px;margin-left:2px}
.phone-num{flex:1 1 auto;min-width:0}
.phone-dd{position:absolute;top:calc(100% + 6px);left:0;width:100%;max-width:360px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30;overflow:hidden}
.phone-dd[hidden]{display:none}
.phone-search{width:100%;background:var(--bg-dark);border:none;border-bottom:1px solid var(--border);color:var(--text);padding:11px 14px;font-size:14px;border-radius:0}
.phone-search:focus{outline:none}
.phone-list{max-height:240px;overflow-y:auto}
.phone-opt{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:14px}
.phone-opt:hover,.phone-opt.active{background:var(--bg-hover)}
.phone-opt .po-flag{font-size:18px;line-height:1}
.phone-opt .po-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phone-opt .po-dial{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.phone-empty{padding:14px;text-align:center;color:var(--text-secondary);font-size:13px}

/* custom date picker — identical on desktop & mobile */
.dp-field{position:relative}
.dp-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;cursor:pointer;text-align:left}
.dp-trigger:hover{border-color:var(--primary)}
.dp-display.dp-empty{color:var(--text-muted)}
.dp-cal-icon{font-size:15px;opacity:.7;flex:0 0 auto}
.dp-pop{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-width:calc(100vw - 48px);background:var(--bg-card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30;padding:12px}
.dp-pop[hidden]{display:none}
.dp-head{display:flex;gap:8px;margin-bottom:10px}
.dp-head select{background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 6px;font-size:13px;cursor:pointer}
.dp-head select:focus{outline:none;border-color:var(--primary)}
.dp-month{flex:1.5}
.dp-year{flex:1}
.dp-dows,.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding:4px 0}
.dp-day{text-align:center;padding:8px 0;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text);background:transparent;border:none}
.dp-day:hover{background:var(--bg-elevated)}
.dp-day.dp-sel{background:var(--primary);color:#fff;font-weight:700}
.dp-day.dp-blank{visibility:hidden;cursor:default}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.dp-foot button{background:transparent;border:none;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;padding:5px 9px;border-radius:6px}
.dp-foot button:hover{background:var(--bg-elevated);color:var(--text)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:800;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;animation:rise .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-card);z-index:1}
.modal-head h3{font-size:18px;font-weight:700}
.modal-close{background:var(--bg-elevated);width:34px;height:34px;border-radius:8px;font-size:16px;color:var(--text)}
.modal-body{padding:22px 24px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px}

/* toast */
#toasts{position:fixed;bottom:24px;right:24px;z-index:1100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg-elevated);border-left:4px solid var(--primary);border-radius:10px;padding:14px 18px;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slidein .25s ease;font-size:14px}
.toast.success{border-left-color:var(--success)}
.toast.danger{border-left-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

.section-title{font-size:15px;font-weight:700;margin:6px 0 14px;color:var(--text-secondary)}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{padding:8px 16px;border-radius:20px;background:var(--bg-elevated);color:var(--text-secondary);font-size:13px;font-weight:600;transition:.15s}
.pill.active{background:var(--primary);color:#fff}

@media(max-width:980px){
  .grid-2{grid-template-columns:1fr}
}
@media(max-width:820px){
  .sidebar{position:fixed;z-index:700;left:0;top:0;width:280px!important;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  /* on mobile the drawer is always full, never the icon rail */
  .sidebar.collapsed .brand-text,.sidebar.collapsed .nav-item span,.sidebar.collapsed .user-row > div,.sidebar.collapsed .nav-section{display:revert;font-size:revert}

  .sidebar.collapsed .logout-btn::before{content:none}
  .topbar{padding:14px 18px}
  .topbar-search{flex-basis:100%;max-width:none;order:3}
  .content{padding:18px}
  .page-title{font-size:20px}
  th,td{padding:11px 14px}
}
/* turn wide data tables into stacked cards on phones */
@media(max-width:640px){
  #content table thead{display:none}
  #content table,#content table tbody,#content table tr,#content table td{display:block;width:100%}

  #content table td[data-th=""]::before,#content table td:not([data-th])::before{content:none}
  #content table td[colspan]{justify-content:center}

    members.push({id:i+1,full_name:name,date_of_birth:iso(dob),phone_number:"+2126"+ri(10000000,99999999),support_phone_number:"",start_date:iso(start),end_date:iso(end),gym_plan:plan,gym_fee_paid:fee,is_active:active,created_at:isoT(addDays(start,0))});
  });

  // payments
  let rcp=1;const payments=[];
  members.forEach(m=>{
    payments.push({id:payments.length+1,member_id:m.id,member_name:m.full_name,amount:m.gym_fee_paid,payment_type:"Membership",description:m.gym_plan+" membership",receipt_number:"RCP-"+String(rcp++).padStart(4,"0"),paid_at:isoT(addDays(m.start_date,0))});
    if(rnd()<0.5)payments.push({id:payments.length+1,member_id:m.id,member_name:m.full_name,amount:Math.round(m.gym_fee_paid*(0.8+rnd()*0.2)),payment_type:"Renewal",description:"Membership renewal",receipt_number:"RCP-"+String(rcp++).padStart(4,"0"),paid_at:isoT(addDays(TODAY,-ri(1,75)))});
  });
  for(let i=0;i<40;i++){const m=pick(members);const opt=rnd()<0.5?["Product Sale",2,30]:["Day Pass",5,15];payments.push({id:payments.length+1,member_id:m.id,member_name:m.full_name,amount:Math.round((opt[1]+rnd()*(opt[2]-opt[1]))*100)/100,payment_type:opt[0],description:opt[0],receipt_number:"RCP-"+String(rcp++).padStart(4,"0"),paid_at:isoT(addDays(TODAY,-ri(0,300)))})}

  // expenses
  let en=1;const expenses=[];
  for(let mb=0;mb<11;mb++){sample(EXPENSE_PRESETS,ri(3,6)).forEach(([cat,desc,lo,hi])=>{expenses.push({id:expenses.length+1,title:desc,description:desc,amount:ri(lo,hi),category:cat,receipt_number:"EXP-"+String(en++).padStart(4,"0"),created_by:pick(users).username,created_at:isoT(addDays(TODAY,-(mb*30+ri(0,27))))})})}

  // purchases
  const purchases=[];
  for(let i=0;i<18;i++){const m=pick(members);const p=pick(products);const q=ri(1,3);purchases.push({id:purchases.length+1,member_id:m.id,member_name:m.full_name,product_id:p.id,product_name:p.name,quantity:q,total_price:Math.round(p.price*q*100)/100,purchased_by:pick(users).username,purchased_at:isoT(addDays(TODAY,-ri(0,90)))})}

  // member activities
  const memberActivities=[];
  for(let i=0;i<12;i++){const m=pick(members);memberActivities.push({id:i+1,member_id:m.id,member_name:m.full_name,activity_type:pick(ACTIVITIES),fee:ri(50,300),is_paid:rnd()<0.7,enrolled_at:isoT(addDays(TODAY,-ri(0,120)))})}

  // logs
  const logs=[];let lid=1;
  users.forEach(e=>{for(let i=0;i<ri(4,9);i++)logs.push({id:lid++,employee_username:e.username,action:"Logged in",created_at:isoT(addDays(TODAY,-ri(0,30)))})});
  sample(members,8).forEach(m=>{const e=pick(users);logs.push({id:lid++,employee_username:e.username,action:"Check-in: "+m.full_name,created_at:isoT(TODAY)})});
  for(let i=0;i<35;i++){const m=pick(members);const e=pick(users);logs.push({id:lid++,employee_username:e.username,action:"Check-in: "+m.full_name,created_at:isoT(addDays(TODAY,-ri(1,14)))})}
  for(let i=0;i<4;i++){const e=pick(users.slice(1));const lt=pick(["Vacation","Sick Leave","Personal"]);const s=addDays(TODAY,ri(3,30));logs.push({id:lid++,employee_username:e.username,action:`Leave Request: ${lt} from ${iso(s)} to ${iso(addDays(s,ri(1,5)))}`,created_at:isoT(addDays(TODAY,-ri(0,20)))})}
  sample(members,6).forEach(m=>{const e=pick(users);logs.push({id:lid++,employee_username:e.username,action:"Added member: "+m.full_name,created_at:isoT(m.start_date)})});

  // maintenance
  const maintenance=[
    {id:1,title:"Treadmill #3 belt replacement",description:"Belt slipping during use",priority:"High",status:"Open",created_by:"sara",created_at:isoT(addDays(TODAY,-2))},
    {id:2,title:"AC unit servicing",description:"Annual maintenance of cooling system",priority:"Medium",status:"In Progress",created_by:"youssef",created_at:isoT(addDays(TODAY,-6))},
    {id:3,title:"Locker room light fix",description:"Two bulbs out in men's locker room",priority:"Low",status:"Done",created_by:"khalid",created_at:isoT(addDays(TODAY,-12))},
  ];

  // leaves
  const leaves=[
    {id:1,employee_username:"sara",type:"Vacation",start_date:iso(addDays(TODAY,7)),end_date:iso(addDays(TODAY,12)),reason:"Family trip",status:"Pending",created_at:isoT(addDays(TODAY,-1))},
    {id:2,employee_username:"youssef",type:"Sick Leave",start_date:iso(addDays(TODAY,-2)),end_date:iso(addDays(TODAY,-1)),reason:"Flu",status:"Approved",created_at:isoT(addDays(TODAY,-3))},
  ];

  const settings={
    gym_name:"Gym Platform",currency:CURRENCY_DEFAULT,country_code:"212",
    auto_birthday_enabled:true,auto_expiry_enabled:true,
    birthday_message:"🎂🎉 Happy Birthday {name}! 🎉🎂\n\nWishing you a strong and healthy year ahead! 💪🔥\nWelcome to your {age}th year!\n\nFrom: {gym_name} 🏋️",
    expiry_message:"Hello {name}! 👋\n\nYour {gym_name} membership ({plan}) expires on {date} — that's in {days} day(s).\n\nRenew now to keep your progress going! 💪",
    broadcast_message:"📢 {gym_name} Announcement\n\nHello {name}! We have an exciting event coming up. Stay tuned for more details! 🏋️🔥",
  };

  return {users,members,products,payments,expenses,purchases,memberActivities,logs,maintenance,leaves,settings,
          _seq:{members:members.length,products:products.length,payments:payments.length,expenses:expenses.length,users:users.length,purchases:purchases.length,maintenance:maintenance.length,leaves:leaves.length,logs:lid,memberActivities:memberActivities.length}};
}

/* ---------- DB (localStorage) ---------- */
let DB=null;
function loadDB(){
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){try{DB=JSON.parse(raw);
    // migrate older data to US Dollar
    if(DB.settings&&(!DB.settings.currency||DB.settings.currency==="DH")){DB.settings.currency="$";saveDB()}
    return}catch(e){}}
  DB=genData();saveDB();
}
function saveDB(){localStorage.setItem(STORE_KEY,JSON.stringify(DB))}
function resetDB(){if(confirm("Reset ALL data back to the demo dataset? Your local changes will be lost.")){localStorage.removeItem(STORE_KEY);loadDB();toast("Demo data restored","success");render()}}
function nextId(key){DB._seq[key]=(DB._seq[key]||0)+1;return DB._seq[key]}
function cur(){return DB.settings.currency||CURRENCY_DEFAULT}
function money(n){return cur()+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function log(action){DB.logs.push({id:nextId("logs"),employee_username:SESSION.username,action,created_at:isoT(new Date())})}

/* ---------- member status helper ---------- */
function memberStatus(m){
  const end=new Date(m.end_date);end.setHours(0,0,0,0);
  if(!m.is_active)return{label:"Inactive",cls:"badge-muted"};
  if(end<TODAY)return{label:"Expired",cls:"badge-danger"};
  if(end<=addDays(TODAY,7))return{label:"Expiring",cls:"badge-warning"};
  return{label:"Active",cls:"badge-success"};
}
function age(dob){const d=new Date(dob);let a=TODAY.getFullYear()-d.getFullYear();const m=TODAY.getMonth()-d.getMonth();if(m<0||(m===0&&TODAY.getDate()<d.getDate()))a--;return a}
function daysToBirthday(dob){const d=new Date(dob);let next=new Date(TODAY.getFullYear(),d.getMonth(),d.getDate());if(next<TODAY)next=new Date(TODAY.getFullYear()+1,d.getMonth(),d.getDate());return daysBetween(TODAY,next)}

function buildNav(){
  const wrap=document.getElementById("navScroll");wrap.innerHTML="";
  NAV.forEach(sec=>{
    if(sec.admin&&SESSION.role!=="admin")return;
    const lbl=document.createElement("div");lbl.className="nav-section";lbl.textContent=sec.section;wrap.appendChild(lbl);
    sec.items.forEach(([key,icon,text])=>{
      const b=document.createElement("button");b.className="nav-item"+(key===CURRENT?" active":"");b.dataset.key=key;
      let badge="";
      if(key==="alerts"){const n=alertCount();if(n)badge=`<span class="nav-badge">${n}</span>`}
      if(key==="birthdays"){const n=DB.members.filter(m=>daysToBirthday(m.date_of_birth)<=7).length;if(n)badge=`<span class="nav-badge">${n}</span>`}
      b.title=text;
      b.innerHTML=`<span class="ic">${icon}</span><span>${text}</span>${badge}`;
      b.onclick=()=>go(key);
      wrap.appendChild(b);
    });
  });
}
function alertCount(){return DB.members.filter(m=>{const s=memberStatus(m);return s.label==="Expired"||s.label==="Expiring"}).length}

function toggleSidebar(){
  const sb=document.getElementById("sidebar");
  if(window.innerWidth<=820){
    const open=sb.classList.toggle("open");
    document.getElementById("sidebarBackdrop").classList.toggle("show",open);
  }else{
    const col=sb.classList.toggle("collapsed");
    try{localStorage.setItem("gym_sidebar",col?"1":"0")}catch(e){}
  }
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
}
function go(key){
  CURRENT=key;SEARCH="";
  closeSidebar();
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
  const meta=PAGE_META[key];
  document.getElementById("pageTitle").textContent=meta[0];
  document.getElementById("pageSub").textContent=typeof meta[1]==="function"?meta[1]():meta[1];
  const showSearch=SEARCH_PAGES.includes(key);
  document.getElementById("topSearchWrap").classList.toggle("active",showSearch);
  document.getElementById("topSearch").value="";
  document.getElementById("content").scrollTop=0;
  render();
}
function onSearch(v){SEARCH=v.toLowerCase().trim();render()}

/* =========================================================================
   RENDER ROUTER
   ========================================================================= */
function render(){
  buildNav();
  const c=document.getElementById("content");
  const fn=PAGES[CURRENT];
  c.innerHTML=fn?fn():"<div class='empty'>Coming soon</div>";
  decorateTables();
}
// Label each table cell with its column header so phones can show rows as cards.
function decorateTables(){
  document.querySelectorAll("#content table").forEach(t=>{
    const ths=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    t.querySelectorAll("tbody tr").forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        if(td.hasAttribute("colspan"))return;
        td.setAttribute("data-th",ths[i]||"");
      });
    });
  });
}

/* ---------- FINANCE ---------- */
function pageFinance(){
  const revenue=DB.payments.reduce((s,p)=>s+p.amount,0);
  const expenses=DB.expenses.reduce((s,e)=>s+e.amount,0);
  const profit=revenue-expenses;
  // by category
  const byCat={};DB.expenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat=Math.max(...cats.map(c=>c[1]),1);
  // last 6 months revenue
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);const next=new Date(TODAY.getFullYear(),TODAY.getMonth()-i+1,1);
    const r=DB.payments.filter(p=>new Date(p.paid_at)>=d&&new Date(p.paid_at)<next).reduce((s,p)=>s+p.amount,0);
    const x=DB.expenses.filter(e=>new Date(e.created_at)>=d&&new Date(e.created_at)<next).reduce((s,e)=>s+e.amount,0);
    months.push({label:d.toLocaleDateString('en',{month:'short'}),r,x})}
  const maxM=Math.max(...months.flatMap(m=>[m.r,m.x]),1);
  return `<div class="stats-grid">
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" style="color:var(--success)">${money(revenue)}</div><div class="stat-label">Total Revenue</div></div>
    <div class="stat-card"><div class="stat-icon">💸</div><div class="stat-value" style="color:var(--danger)">${money(expenses)}</div><div class="stat-label">Total Expenses</div></div>
    <div class="stat-card"><div class="stat-icon">${profit>=0?'📈':'📉'}</div><div class="stat-value" style="color:${profit>=0?'var(--success)':'var(--danger)'}">${money(profit)}</div><div class="stat-label">Net Profit</div></div>
    <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value">${revenue?Math.round(profit/revenue*100):0}%</div><div class="stat-label">Profit Margin</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-head"><h2>📅 Last 6 Months</h2></div><div class="card-body">
      ${months.map(m=>`<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><b>${m.label}</b><span><span style="color:var(--success)">${money(m.r)}</span> / <span style="color:var(--danger)">${money(m.x)}</span></span></div>
        <div class="bar-track" style="margin-bottom:4px"><div class="bar-fill" style="width:${m.r/maxM*100}%;background:var(--success)"></div></div>
        <div class="bar-track"><div class="bar-fill" style="width:${m.x/maxM*100}%;background:var(--danger)"></div></div>
      </div>`).join("")}
    </div></div>
    <div class="card"><div class="card-head"><h2>🧾 Expenses by Category</h2></div><div class="card-body">
      ${cats.map(([c,v])=>`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${EXPENSE_ICONS[c.toLowerCase()]||'📝'} ${c}</span><b>${money(v)}</b></div>

}

function modal(title,bodyHTML,onSave,saveLabel="Save"){
  const ov=document.createElement("div");ov.className="modal-overlay";
  ov.innerHTML=`<div class="modal">
    <div class="modal-head"><h3>${title}</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-cancel>Cancel</button>${onSave?`<button class="btn btn-primary" data-save>${saveLabel}</button>`:""}</div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector(".modal-close").onclick=close;
  ov.querySelector("[data-cancel]").onclick=close;
  ov.addEventListener("mousedown",e=>{if(e.target===ov)close()});
  if(onSave)ov.querySelector("[data-save]").onclick=()=>{if(onSave(ov)!==false)close()};
  const first=ov.querySelector("input,select,textarea");if(first)setTimeout(()=>first.focus(),50);
  return ov;
}
const val=(ov,id)=>ov.querySelector("#"+id).value.trim();
const numVal=(ov,id)=>parseFloat(ov.querySelector("#"+id).value)||0;

/* ---------- International phone field ---------- */
// Split a stored "+212600..." into its dial code + local number (longest dial-code match wins).
function splitPhone(value){
  const v=(value||"").trim();
  if(v.startsWith("+")){
    const match=COUNTRY_CODES.filter(c=>v.startsWith(c.d)).sort((a,b)=>b.d.length-a.d.length)[0];
    if(match)return{dial:match.d,number:v.slice(match.d.length).replace(/[^\d]/g,"")};
  }
  return{dial:DEFAULT_DIAL,number:v.replace(/[^\d]/g,"")};
}
// Render the combined country-code dropdown + number input. `base` is the element id prefix (e.g. "mPhone").
function phoneFieldHTML(base,value){
  const {dial,number}=splitPhone(value);
  const sel=COUNTRY_CODES.find(c=>c.d===dial)||COUNTRY_CODES.find(c=>c.d===DEFAULT_DIAL);
  return `<div class="phone-field" id="${base}Wrap">
    <button type="button" class="phone-cc" id="${base}Btn">
      <span class="phone-cc-flag">${flagEmoji(sel.i)}</span><span class="phone-cc-dial">${sel.d}</span><span class="phone-cc-caret">▾</span>
    </button>
    <input type="hidden" id="${base}Dial" value="${sel.d}">
    <input class="phone-num" id="${base}Num" type="tel" inputmode="numeric" placeholder="Phone number" value="${number||""}">
    <div class="phone-dd" id="${base}Dd" hidden>
      <input class="phone-search" id="${base}Search" placeholder="Search country or code…" autocomplete="off">
      <div class="phone-list" id="${base}List"></div>
    </div>
  </div>`;
}
// Combined value for saving: dial code + digits, e.g. "+212600112233".
function phoneVal(ov,base){
  const dial=ov.querySelector("#"+base+"Dial").value;
  const num=(ov.querySelector("#"+base+"Num").value||"").replace(/[^\d]/g,"");
  return num?dial+num:"";
}
// Wire up the dropdown behaviour after the modal is in the DOM.
function setupPhoneField(ov,base){
  const wrap=ov.querySelector("#"+base+"Wrap");if(!wrap)return;
  const btn=wrap.querySelector("#"+base+"Btn"),dd=wrap.querySelector("#"+base+"Dd"),
        search=wrap.querySelector("#"+base+"Search"),list=wrap.querySelector("#"+base+"List"),
        dialIn=wrap.querySelector("#"+base+"Dial");
  function renderList(q){
    const term=(q||"").trim().toLowerCase().replace(/^\+/,"");
    const items=COUNTRY_CODES.filter(c=>!term||c.n.toLowerCase().includes(term)||c.d.replace("+","").includes(term)||c.i.toLowerCase()===term);
    list.innerHTML=items.length?items.map(c=>`<div class="phone-opt${c.d===dialIn.value?' active':''}" data-dial="${c.d}" data-iso="${c.i}"><span class="po-flag">${flagEmoji(c.i)}</span><span class="po-name">${c.n}</span><span class="po-dial">${c.d}</span></div>`).join(""):`<div class="phone-empty">No match</div>`;
  }

/* ---------- Custom date picker (consistent on desktop + mobile) ---------- */
const DP_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DP_DOW=["Su","Mo","Tu","We","Th","Fr","Sa"];
// Render a date field. `base` becomes the id of the HIDDEN input holding the
// ISO (yyyy-mm-dd) value, so existing val(ov,base) reads it unchanged.
function dateFieldHTML(base,value){
  const has=!!value;
  return `<div class="dp-field" id="${base}Wrap">
    <button type="button" class="dp-trigger" id="${base}Btn">
      <span class="dp-display${has?'':' dp-empty'}" id="${base}Disp">${has?fmtDate(value):'Select date'}</span>
      <span class="dp-cal-icon">📅</span>
    </button>
    <input type="hidden" id="${base}" value="${value||''}">
    <div class="dp-pop" id="${base}Pop" hidden>
      <div class="dp-head">
        <select class="dp-month" id="${base}Mon"></select>
        <select class="dp-year" id="${base}Yr"></select>
      </div>
      <div class="dp-dows">${DP_DOW.map(d=>`<div class="dp-dow">${d}</div>`).join('')}</div>
      <div class="dp-days" id="${base}Days"></div>
      <div class="dp-foot"><button type="button" id="${base}Clear">Clear</button><button type="button" id="${base}Today">Today</button></div>
    </div>
  </div>`;
}
// Wire up the picker after the modal is in the DOM (mirrors setupPhoneField).
function setupDateField(ov,base){
  const wrap=ov.querySelector("#"+base+"Wrap");if(!wrap)return;
  const btn=wrap.querySelector("#"+base+"Btn"),pop=wrap.querySelector("#"+base+"Pop"),
        hidden=wrap.querySelector("#"+base),disp=wrap.querySelector("#"+base+"Disp"),
        monSel=wrap.querySelector("#"+base+"Mon"),yrSel=wrap.querySelector("#"+base+"Yr"),
        days=wrap.querySelector("#"+base+"Days");
  const maxY=new Date().getFullYear(),minY=1920;
  let yrHtml='';for(let y=maxY;y>=minY;y--)yrHtml+=`<option value="${y}">${y}</option>`;yrSel.innerHTML=yrHtml;
  monSel.innerHTML=DP_MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  // parse yyyy-mm-dd without timezone drift
  function parsed(){const v=hidden.value;if(!v)return null;const p=v.split('-');return{y:+p[0],m:+p[1]-1,d:+p[2]}}
  const init=parsed();
  let view=init?{y:init.y,m:init.m}:{y:Math.min(maxY,1995),m:0};
  function renderDays(){
    monSel.value=view.m;yrSel.value=view.y;
    const first=new Date(view.y,view.m,1).getDay(),dim=new Date(view.y,view.m+1,0).getDate(),sel=parsed();
    let html='';
    for(let i=0;i<first;i++)html+=`<button type="button" class="dp-day dp-blank" tabindex="-1"></button>`;
    for(let d=1;d<=dim;d++){const on=sel&&sel.y===view.y&&sel.m===view.m&&sel.d===d;html+=`<button type="button" class="dp-day${on?' dp-sel':''}" data-d="${d}">${d}</button>`}
    days.innerHTML=html;
  }
  function pick(y,m,d){const v=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;hidden.value=v;disp.textContent=fmtDate(v);disp.classList.remove('dp-empty');pop.hidden=true}
  btn.onclick=()=>{if(pop.hidden){renderDays();pop.hidden=false}else pop.hidden=true};
  monSel.onchange=()=>{view.m=+monSel.value;renderDays()};
  yrSel.onchange=()=>{view.y=+yrSel.value;renderDays()};
  days.onclick=e=>{const b=e.target.closest('.dp-day');if(!b||b.classList.contains('dp-blank'))return;pick(view.y,view.m,+b.dataset.d)};
  wrap.querySelector("#"+base+"Today").onclick=()=>{const t=new Date();view={y:t.getFullYear(),m:t.getMonth()};pick(t.getFullYear(),t.getMonth(),t.getDate())};
  wrap.querySelector("#"+base+"Clear").onclick=()=>{hidden.value='';disp.textContent='Select date';disp.classList.add('dp-empty');pop.hidden=true};
  document.addEventListener("mousedown",e=>{if(!wrap.contains(e.target))pop.hidden=true});
}

  const err=document.getElementById("loginError");
  if(!u||!p){err.textContent="⚠️ Please enter username and password";shakeCard();return}
  const user=DB.users.find(x=>x.username===u&&x.password===p&&x.is_active);
  if(!user){err.textContent="⚠️ Invalid username or password";shakeCard();return}
  SESSION={id:user.id,username:user.username,full_name:user.full_name,role:user.role};
  if(document.getElementById("rememberMe").checked)localStorage.setItem("gym_session",JSON.stringify(SESSION));
  log("Logged in");saveDB();
  err.style.color="var(--success)";err.textContent="✓ Welcome back!";
  const lg=document.getElementById("login");
  lg.classList.add("fade-out");
  setTimeout(()=>{lg.classList.add("hidden");lg.classList.remove("fade-out");err.style.color="";err.textContent="";enterApp();},520);
}
function doLogout(){localStorage.removeItem("gym_session");SESSION=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");document.getElementById("loginPass").value="";document.getElementById("loginError").textContent=""}
function enterApp(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("brandName").textContent=(DB.settings.gym_name||"Gym Platform").toUpperCase();
  document.getElementById("userAvatar").textContent=SESSION.full_name[0];
  document.getElementById("userNameLbl").textContent=SESSION.full_name;
  document.getElementById("userRoleLbl").textContent=SESSION.role;
  try{if(window.innerWidth>820&&localStorage.getItem("gym_sidebar")==="1")document.getElementById("sidebar").classList.add("collapsed")}catch(e){}
  go("dashboard");
}

/* broadcast audience preview hookup (event delegation) */
document.addEventListener("change",e=>{if(e.target&&e.target.id==="bcAudience")previewBroadcast()});

/* enter-to-login */
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
document.getElementById("loginUser").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginPass").focus()});

/* =========================================================================
   STARTUP
   ========================================================================= */
function spawnParticles(){
  const wrap=document.getElementById("particles");if(!wrap)return;
  const icons=["🏋️","💪","🔥","⚡","🏆","🥇","🤸","💥"];
  for(let i=0;i<20;i++){const s=document.createElement("i");
    s.textContent=icons[i%icons.length];
    s.style.left=(Math.random()*100)+"%";
    s.style.fontSize=(12+Math.random()*22)+"px";
    s.style.animationDuration=(7+Math.random()*9)+"s";
    s.style.animationDelay=(Math.random()*7)+"s";
    wrap.appendChild(s);}
}
function bootSplash(){
  spawnParticles();
  const steps=["Warming up the engine…","Racking the weights…","Counting reps & members…","Calibrating the scoreboard…","Ready to train! 💪"];
  let i=0;const fill=document.getElementById("splashFill"),status=document.getElementById("splashStatus");
  const t=setInterval(()=>{
    i++;status.textContent=steps[Math.min(i,steps.length-1)];fill.style.width=(i/steps.length*100)+"%";
    if(i>=steps.length){clearInterval(t);setTimeout(()=>{
      const splash=document.getElementById("splash");
      splash.classList.add("fade-out");
      setTimeout(()=>{
        splash.classList.add("hidden");
        const saved=localStorage.getItem("gym_session");
        if(saved){try{SESSION=JSON.parse(saved);if(DB.users.some(u=>u.username===SESSION.username)){enterApp();return}}catch(e){}}
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("loginUser").focus();
      },560);
    },350)}
  },450);
}
loadDB();
bootSplash();
</script>
